[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ztna-lab"
version = "0.2.0"
description = "A loopback-only ZTNA/VPN architecture lab, independent of aTrust"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=42.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
ztna-lab-demo = "labztna.demo:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
